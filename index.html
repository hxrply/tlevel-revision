<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Revision site for the Pearson T Level in Digital Software Development / Digital Production, Design and Development — core Papers 1 and 2, the Employer Set Project (Tasks 1, 2, 3, 4a, 4b) and the Occupational Specialism. Notes, flashcards, quizzes and progress tracking, all on-device.">
