<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Revision for the Pearson T Level in Digital Production, Design and Development: Core Papers 1 and 2 (19536, 19537), the Employer Set Project (19538) and the Occupational Specialism (19540). Notes, key words, worked code, quizzes and progress tracking, all stored on your device.">
<title>T Level Digital — Production, Design &amp; Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=25">
</head>
<body>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">&lt;/&gt;</span>
      <span class="brand-name">T Level Digital</span>
    </div>
    <div class="brand-sub">Production, Design &amp; Development<br>revision for the resits</div>

    <nav class="nav" id="nav"></nav>

    <div class="nav-group-label">Settings</div>
    <button class="nav-btn" id="themeBtn"><span class="ico">◐</span> Theme</button>
    <button class="nav-btn" id="resetBtn"><span class="ico">⟲</span> Reset progress</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="btn btn-sm menu-toggle" id="menuBtn">☰</button>
      <div class="searchwrap">
        <span class="sicon">⌕</span>
        <input type="text" id="search" placeholder="Search notes, key terms, tasks…  (press /)" autocomplete="off">
      </div>
    </div>
    <div id="view"></div>
    <button class="to-top" id="toTop" type="button" hidden>↑ Top</button>
  </main>

</div>

<!-- ?v= is bumped on every deploy so phones and browsers do not serve a
     stale cached copy of the content or the app. -->
<script src="data/core-p1.js?v=25"></script>
<script src="data/core-p2.js?v=25"></script>
<script src="data/esp.js?v=25"></script>
<script src="data/os.js?v=25"></script>
<script src="data/quiz.js?v=25"></script>
<script src="data/extras.js?v=25"></script>
<script src="data/technique.js?v=25"></script>
<script src="data/marking.js?v=25"></script>
<script src="data/tutor.js?v=25"></script>
<script src="data/plan.js?v=25"></script>
<script src="data/catchup.js?v=25"></script>
<script src="data/tutornotes.js?v=25"></script>
<script src="app.js?v=25"></script>
</body>
</html>
