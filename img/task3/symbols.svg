<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img"><title>Flowchart symbols</title><desc>The six flowchart symbols used in Task 3 and what each is for.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="250" fill="#FFFFFF"/><rect x="65" y="40" width="130" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="130" y="60" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Start / End</text><rect x="265" y="38" width="150" height="44" rx="3" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">total = a + b</text><polygon points="494,38 634,38 606,82 466,82" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="550" y="60" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Input choice</text><polygon points="130,138 190,170 130,202 70,170" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="130" y="170" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">Valid?</text><rect x="265" y="148" width="150" height="44" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><line x1="275" y1="148" x2="275" y2="192" stroke="#534AB7" stroke-width="1"/><line x1="405" y1="148" x2="405" y2="192" stroke="#534AB7" stroke-width="1"/><text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">load_data()</text><path d="M490 150 L490 190 A60 8 0 0 0 610 190 L610 150 A60 8 0 0 0 490 150 Z" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><path d="M490 150 A60 8 0 0 0 610 150" fill="none" stroke="#993C1D" stroke-width="1"/><text x="550" y="174" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">data.csv</text><text x="130" y="100" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Terminator - one start, one end</text><text x="340" y="100" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Process - a calculation</text><text x="550" y="100" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Input / output</text><text x="130" y="220" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Decision - label Yes and No</text><text x="340" y="220" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Subroutine - drawn separately</text><text x="550" y="220" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Data - the CSV file</text></svg>