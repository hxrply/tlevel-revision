<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img"><title>Main menu with subroutines</title><desc>Load the data once, show the menu, validate the choice, call a subroutine for each option and loop back to the menu until the user chooses Exit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="600" fill="#FFFFFF"/><rect x="190" y="20" width="120" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="250" y="40" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Start</text><path d="M250 60 L250 78" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="155" y="80" width="190" height="44" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><line x1="165" y1="80" x2="165" y2="124" stroke="#534AB7" stroke-width="1"/><line x1="335" y1="80" x2="335" y2="124" stroke="#534AB7" stroke-width="1"/><text x="250" y="102" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">data = load_data()</text><path d="M250 124 L250 146" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="169,148 359,148 331,192 141,192" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="170" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Output menu 1 to 3</text><path d="M250 192 L250 214" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="125" y="216" width="250" height="44" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><line x1="135" y1="216" x2="135" y2="260" stroke="#534AB7" stroke-width="1"/><line x1="365" y1="216" x2="365" y2="260" stroke="#534AB7" stroke-width="1"/><text x="250" y="238" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">choice = get_valid_number(1, 3)</text><path d="M250 260 L250 283" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="250,283 325,318 250,353 175,318" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="250" y="318" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">choice = 1?</text><text x="264" y="372" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text><path d="M250 353 L250 383" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="250,383 325,418 250,453 175,418" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="250" y="418" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">choice = 2?</text><text x="264" y="472" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text><path d="M250 453 L250 480" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="179,480 349,480 321,524 151,524" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="502" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Output "Goodbye"</text><path d="M250 524 L250 546" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="190" y="546" width="120" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="250" y="566" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">End</text><text x="352" y="306" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text><path d="M325 318 L418 318" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="420" y="296" width="180" height="44" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><line x1="430" y1="296" x2="430" y2="340" stroke="#534AB7" stroke-width="1"/><line x1="590" y1="296" x2="590" y2="340" stroke="#534AB7" stroke-width="1"/><text x="510" y="318" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">show_trend(data)</text><text x="352" y="406" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text><path d="M325 418 L418 418" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="420" y="396" width="180" height="44" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><line x1="430" y1="396" x2="430" y2="440" stroke="#534AB7" stroke-width="1"/><line x1="590" y1="396" x2="590" y2="440" stroke="#534AB7" stroke-width="1"/><text x="510" y="418" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">show_compare(data)</text><path d="M600 318 L645 318 L645 170 L354 170" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M600 418 L645 418 L645 318" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/></svg>