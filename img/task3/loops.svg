<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><title>While and repeat loops</title><desc>A while loop checks before the body and can run zero times. A repeat-until loop checks after the body and always runs once. Both loop back with an arrow going up.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text x="170" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">WHILE / FOR - check first</text><text x="500" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">REPEAT UNTIL - check after</text><rect x="110" y="40" width="120" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="170" y="60" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Start</text><path d="M170 80 L170 106" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="95" y="106" width="150" height="44" rx="3" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="170" y="128" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">count = 1</text><path d="M170 150 L170 177" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="170,177 240,212 170,247 100,212" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170" y="212" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">count &lt;= 3?</text><text x="184" y="266" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text><path d="M170 247 L170 282" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="109,282 259,282 231,326 81,326" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="170" y="304" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Output count</text><path d="M170 326 L170 352" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="95" y="352" width="150" height="44" rx="3" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="170" y="374" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">count = count + 1</text><path d="M95 374 L40 374 L40 212 L98 212" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><text x="262" y="200" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text><path d="M240 212 L300 212 L300 410" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="255" y="410" width="90" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="300" y="430" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">End</text><rect x="440" y="40" width="120" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="500" y="60" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Start</text><path d="M500 80 L500 106" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="439,106 589,106 561,150 411,150" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="500" y="128" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Input choice</text><path d="M500 150 L500 177" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="500,177 565,212 500,247 435,212" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="500" y="212" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">Valid?</text><text x="514" y="266" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text><path d="M500 247 L500 282" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="455" y="282" width="90" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="500" y="302" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">End</text><text x="400" y="200" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text><path d="M435 212 L380 212 L380 128 L418 128" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/></svg>