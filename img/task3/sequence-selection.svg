<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img"><title>Sequence and selection</title><desc>Sequence: boxes one after another. Selection: a decision diamond with Yes and No paths that join back up.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/><text x="170" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Sequence</text><text x="480" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Selection (IF / ELSE)</text><rect x="110" y="40" width="120" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="170" y="60" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Start</text><path d="M170 80 L170 104" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="99,106 269,106 241,150 71,150" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="170" y="128" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Input price, qty</text><path d="M170 150 L170 176" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="85" y="178" width="170" height="44" rx="3" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="170" y="200" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">total = price * qty</text><path d="M170 222 L170 248" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="99,250 269,250 241,294 71,294" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="170" y="272" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Output total</text><path d="M170 294 L170 320" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="110" y="320" width="120" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="170" y="340" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">End</text><polygon points="359,38 509,38 481,82 331,82" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="420" y="60" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Input age</text><path d="M420 82 L420 113" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="420,115 485,150 420,185 355,150" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="420" y="150" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">age &gt;= 18?</text><text x="434" y="205" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text><path d="M420 185 L420 226" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="359,228 509,228 481,272 331,272" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="420" y="250" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Output "Adult"</text><text x="505" y="138" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text><path d="M485 150 L524 150" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="544,128 664,128 636,172 516,172" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="590" y="150" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Output "Child"</text><path d="M420 272 L420 318" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M590 172 L590 340 L482 340" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="360" y="320" width="120" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="420" y="340" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">End</text></svg>