<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img"><title>Validation loop</title><desc>Type check then range check. Any invalid input shows a message and loops back up to ask again. Only valid input reaches Return.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/><rect x="200" y="20" width="120" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="260" y="40" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Start</text><path d="M260 60 L260 88" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="194,88 354,88 326,132 166,132" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="260" y="110" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Input choice</text><path d="M260 132 L260 165" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="260,165 345,200 260,235 175,200" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="260" y="200" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">Whole number?</text><text x="274" y="254" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text><path d="M260 235 L260 265" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="260,265 345,300 260,335 175,300" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="260" y="300" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">Is it 1 to 4?</text><text x="274" y="354" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text><path d="M260 335 L260 370" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="185" y="370" width="150" height="40" rx="20" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1"/><text x="260" y="390" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Return choice</text><text x="372" y="188" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text><path d="M345 200 L408 200" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="429,175 599,175 571,225 401,225" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="500" y="191" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Output "Must be</text><text x="500" y="209" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#085041">a number"</text><text x="372" y="288" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text><path d="M345 300 L408 300" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><polygon points="429,275 599,275 571,325 401,325" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="500" y="291" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Output "Choose</text><text x="500" y="309" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#085041">1 to 4"</text><path d="M585 200 L640 200 L640 110 L344 110" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M585 300 L640 300 L640 200" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/></svg>